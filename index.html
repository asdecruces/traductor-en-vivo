<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traductor en vivo EN → ES · Gemini</title>
<style>
  :root{--bg:#0e0f12;--panel:#17191e;--line:#262a31;--txt:#e9eaee;--mut:#8b909b;--acc:#ff4d3d;--ok:#3ddc84}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{font-size:15px;margin:0 12px 0 0;letter-spacing:.04em;text-transform:uppercase}
  input,select{background:#0b0c0f;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
  #key{width:260px}
  button{border:0;border-radius:8px;padding:9px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:#2a2e36;color:var(--txt)}
  #start{background:var(--acc);color:#fff}
  #start.on{background:#444}
  .status{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);margin-left:auto}
  .dot{width:9px;height:9px;border-radius:50%;background:#555}
  .dot.live{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  #meter{width:80px;height:6px;background:#222;border-radius:3px;overflow:hidden}
  #meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
  main{flex:1;display:grid;grid-template-columns:1fr 1.4fr;min-height:0}
  section{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
  section:last-child{border-right:0}
  .label{padding:10px 18px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line)}
  .feed{flex:1;overflow-y:auto;padding:18px;white-space:pre-wrap}
  #en{color:#b9bdc7;font-size:18px}
  #es{font-size:28px;line-height:1.35;font-weight:500}
  .cur{color:var(--acc)}
  label.chk{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
  .err{color:#ff8a7a}
  @media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:1fr 1.5fr}section{border-right:0;border-bottom:1px solid var(--line)}#key{width:100%}}
</style>
</head>
<body>
<header>
  <h1>EN → ES en vivo</h1>
  <input id="key" type="password" placeholder="Gemini API key" autocomplete="off">
  <input id="model" value="gemini-3.5-live-translate-preview" title="Modelo" style="width:250px">
  <label class="chk"><input type="checkbox" id="echoAudio"> Oír voz traducida</label>
  <button id="start">● Escuchar</button>
  <button id="clear">Limpiar</button>
  <button id="copy">Copiar</button>
  <div class="status"><div id="meter"><i></i></div><span class="dot" id="dot"></span><span id="st">Detenido</span></div>
</header>
<main>
  <section><div class="label">Inglés · transcripción</div><div class="feed" id="en"></div></section>
  <section><div class="label">Español · traducción</div><div class="feed" id="es"></div></section>
</main>

<script>
const $ = id => document.getElementById(id);
const enEl = $('en'), esEl = $('es');
let ws, ctx, stream, node, src, playCtx, playTime = 0, running = false;
let enText = '', esText = '';

const DEFAULT_KEY = '';
try { $('key').value = localStorage.getItem('gem_key') || DEFAULT_KEY; } catch(e){ $('key').value = DEFAULT_KEY; }

function setStatus(t, live, err){ $('st').textContent = t; $('st').className = err ? 'err' : ''; $('dot').className = 'dot' + (live ? ' live' : ''); }
function render(){
  enEl.textContent = enText; esEl.textContent = esText;
  enEl.scrollTop = enEl.scrollHeight; esEl.scrollTop = esEl.scrollHeight;
}

// AudioWorklet: captura mic, baja a 16 kHz PCM16, manda bloques de ~100 ms
const workletCode = `
class Rec extends AudioWorkletProcessor{
  constructor(o){super();this.ratio=sampleRate/16000;this.buf=[];this.acc=0;}
  process(inputs){
    const ch=inputs[0][0]; if(!ch) return true;
    let sum=0;
    for(let i=0;i<ch.length;i++){sum+=ch[i]*ch[i];}
    // decimación simple con promedio
    for(this.acc; this.acc < ch.length; this.acc += this.ratio){
      const i=Math.floor(this.acc); this.buf.push(ch[i]);
    }
    this.acc -= ch.length;
    if(this.buf.length>=1600){
      const out=new Int16Array(this.buf.length);
      for(let i=0;i<this.buf.length;i++){const s=Math.max(-1,Math.min(1,this.buf[i]));out[i]=s<0?s*0x8000:s*0x7fff;}
      this.port.postMessage({pcm:out.buffer,rms:Math.sqrt(sum/ch.length)},[out.buffer]);
      this.buf=[];
    }
    return true;
  }
}
registerProcessor('rec',Rec);`;

function b64(buf){
  let s=''; const b=new Uint8Array(buf);
  for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  return btoa(s);
}

function playPcm(b64data, rate=24000){
  if(!$('echoAudio').checked) return;
  if(!playCtx) playCtx = new AudioContext({sampleRate: rate});
  const bin = atob(b64data), n = bin.length/2, f = new Float32Array(n);
  for(let i=0;i<n;i++){ let v = bin.charCodeAt(2*i) | (bin.charCodeAt(2*i+1)<<8); if(v>32767) v-=65536; f[i]=v/32768; }
  const ab = playCtx.createBuffer(1, n, rate); ab.copyToChannel(f,0);
  const s = playCtx.createBufferSource(); s.buffer = ab; s.connect(playCtx.destination);
  playTime = Math.max(playTime, playCtx.currentTime); s.start(playTime); playTime += ab.duration;
}

async function start(){
  const key = $('key').value.trim();
  if(!key){ setStatus('Falta la API key', false, true); return; }
  try { localStorage.setItem('gem_key', key); } catch(e){}
  setStatus('Conectando…');

  if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
    setStatus('Micrófono bloqueado: abre la página desde https:// o localhost', false, true); return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1, echoCancellation:true, noiseSuppression:true}});
  }catch(e){
    const why = { NotAllowedError:'permiso denegado (revisa el candado de la barra de direcciones)',
                  NotFoundError:'no se encontró micrófono', NotReadableError:'otra app está usando el micrófono',
                  SecurityError:'el navegador bloquea el micrófono aquí' }[e.name] || e.name;
    setStatus('Sin micrófono: ' + why, false, true); return;
  }

  const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${encodeURIComponent(key)}`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    ws.send(JSON.stringify({ setup: {
      model: 'models/' + $('model').value.trim(),
      generationConfig: { responseModalities: ['AUDIO'] },
      inputAudioTranscription: {},
      outputAudioTranscription: {},
      translationConfig: { targetLanguageCode: 'es', echoTargetLanguage: false }
    }}));
  };

  ws.onmessage = async ev => {
    const raw = typeof ev.data === 'string' ? ev.data : await ev.data.text();
    let m; try { m = JSON.parse(raw); } catch(e){ return; }
    if(m.setupComplete){ startMic(); return; }
    const sc = m.serverContent; if(!sc) return;
    if(sc.inputTranscription?.text){ enText += sc.inputTranscription.text; render(); }
    if(sc.outputTranscription?.text){ esText += sc.outputTranscription.text; render(); }
    if(sc.modelTurn?.parts){
      for(const p of sc.modelTurn.parts){
        if(p.inlineData?.data) playPcm(p.inlineData.data, parseInt((p.inlineData.mimeType||'').split('rate=')[1]) || 24000);
        if(p.text){ esText += p.text; render(); }
      }
    }
    if(sc.turnComplete){
      if(enText && !enText.endsWith('\n')) enText += '\n\n';
      if(esText && !esText.endsWith('\n')) esText += '\n\n';
      render();
    }
  };

  ws.onerror = () => setStatus('Error de conexión', false, true);
  ws.onclose = ev => { if(running) setStatus('Cerrado: ' + (ev.reason || ev.code), false, true); stopAudio(); running=false; $('start').textContent='● Escuchar'; $('start').classList.remove('on'); };
}

async function startMic(){
  ctx = new AudioContext();
  const url = URL.createObjectURL(new Blob([workletCode], {type:'application/javascript'}));
  await ctx.audioWorklet.addModule(url);
  src = ctx.createMediaStreamSource(stream);
  node = new AudioWorkletNode(ctx, 'rec');
  node.port.onmessage = e => {
    $('meter').firstChild.style.width = Math.min(100, e.data.rms * 400) + '%';
    if(ws?.readyState === 1) ws.send(JSON.stringify({ realtimeInput: { audio: { data: b64(e.data.pcm), mimeType: 'audio/pcm;rate=16000' } } }));
  };
  src.connect(node);
  running = true;
  setStatus('Escuchando', true);
  $('start').textContent = '■ Detener'; $('start').classList.add('on');
}

function stopAudio(){
  try{ node?.disconnect(); src?.disconnect(); ctx?.close(); }catch(e){}
  stream?.getTracks().forEach(t => t.stop());
  node = src = ctx = stream = null;
  $('meter').firstChild.style.width = '0';
}

function stop(){
  running = false;
  try { ws?.readyState === 1 && ws.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } })); } catch(e){}
  setTimeout(() => ws?.close(), 1500);
  stopAudio();
  setStatus('Detenido');
  $('start').textContent = '● Escuchar'; $('start').classList.remove('on');
}

$('start').onclick = () => running ? stop() : start();
$('clear').onclick = () => { enText = esText = ''; render(); };
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText('EN:\n' + enText + '\n\nES:\n' + esText); $('copy').textContent = '¡Copiado!'; setTimeout(()=>$('copy').textContent='Copiar',1200); } catch(e){}
};
</script>
</body>
</html>
